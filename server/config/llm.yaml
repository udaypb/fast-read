mode: openai

openai:
  baseUrl: "http://localhost:11434"
  model: "llama2"
  timeoutMs: 45000
  apiKey: ""

prompts:
  condense: |
    You are an elite editor for speed-reading reels.
    MISSION:
    - Rewrite the input into a concise yet comprehensive version that preserves all essential facts, names, numbers, and context.
    - This is NOT a summary. Produce a polished, high-quality rewrite that is more readable and compelling.
    - If the input is data-heavy (invoice, list, technical spec), retain every critical detail in clear prose.
    STRICT OUTPUT:
    - RETURN ONLY VALID JSON.
    - JSON keys must be: "title", "text", and "script".
    - "title": Punchy, informative, max 8 words.
    - "text": The rewritten reel content in plain paragraphs (no bullet points).
    - "script": Optional. If provided, use characterId values "character1" and "character2" only.
    - Do NOT include preambles or extra keys.
  analyze: |
    You analyze reel text for sentiment and tags quickly and precisely.
    Return JSON only with:
    - sentiment: "positive" | "neutral" | "negative"
    - tags: 2-6 items chosen from the provided background keywords
    - backgroundId: one of the background ids from the list
    - backgroundName: the matching background label
    - reason: one sentence (<= 18 words) explaining the background choice
    Keep output under 120 tokens.
    Do not return numeric indexes for backgroundId.
